<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Product List - NGC Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        indigo: {
                            600: '#2563eb', // Mapped to var(--secondary) so JS switchTab works without edits
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Variables from Technology Wishlist */
        :root {
            --primary: #0f172a;
            --secondary: #2563eb;
            --secondary-hover: #1d4ed8;
            --accent: #38bdf8;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
        }

        /* Fixed Background Layer */
        html::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('/background.png?v=1');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            opacity: 0.8; 
            z-index: -1; 
        }

        body {
            color: var(--text-main);
            position: relative; 
            z-index: 1;
            /* background-color removed so html::before shows through */
            background: transparent !important; 
        }

        /* Glassmorphism Navigation */
        .nav-glass {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Main Headers */
        .section-header {
            font-size: 2.8em;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--primary);
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
            margin-bottom: 0;
        }

        .header-subtitle {
            font-size: 1.2em;
            color: var(--primary);
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
        }

        /* Wishlist-style Cards */
        .card-container {
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-top: 5px solid var(--secondary);
            backdrop-filter: blur(5px); 
            overflow: hidden; /* Keeps tab borders inside rounded corners */
        }

        /* Form Inputs */
        .input-label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--primary);
            font-size: 1.1em;
        }

        .form-input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 16px;
            transition: all 0.3s ease;
            background-color: #fcfcfd;
            outline: none;
            cursor: pointer;
        }
        
        input[type="text"].form-input, input[type="number"].form-input, input[type="datetime-local"].form-input {
            cursor: text;
        }

        .form-input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background-color: #ffffff;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-hover) 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: 2px solid var(--danger);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        /* Table styles inside schedule */
        #scheduleOutput {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="nav-glass sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center h-16">
                <div class="flex items-center">
                    <img src="Hartalega_Symposium.png" alt="Logo" class="h-8 w-auto mr-3" onerror="this.style.display='none'">
                    <span class="text-2xl font-black text-slate-900 tracking-tighter">NGC <span style="color: var(--secondary)">Scheduler</span></span>
                    
                    <div class="hidden sm:ml-10 sm:flex sm:space-x-4 lg:space-x-6 overflow-x-auto">
                        <a href="index.html" class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300 whitespace-nowrap">Dashboard</a>
                        <a href="schedule.html" class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300 whitespace-nowrap">Master Schedule</a>
                        <a href="settings.html" class="inline-flex items-center px-1 pt-1 border-b-2 border-blue-600 text-sm font-bold text-slate-900 whitespace-nowrap">Master Product List</a>
                        <a href="matrices.html" class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300 whitespace-nowrap">Downtime Matrices</a>
                        <a href="lines.html" class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300 whitespace-nowrap">Line Settings</a>
                        <a href="inventory.html" class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300 whitespace-nowrap">Inventory Details</a>
                        <a href="about.html" class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300 whitespace-nowrap">About</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        
        <div class="mb-10 text-center sm:text-left">
            <h1 class="section-header">Master Product List</h1>
            <p class="header-subtitle mt-2">Standardize factory outputs using the 21-character Global Glove Code (GGC) generator.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- Code Builder Form -->
            <div class="lg:col-span-12 xl:col-span-8">
                <div class="card-container overflow-hidden">
                    <div class="px-8 py-6 border-b border-slate-100 bg-indigo-900 flex justify-between items-center">
                        <h3 class="text-xs font-black text-white uppercase tracking-[0.2em] flex items-center">
                            <svg class="h-4 w-4 mr-3 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                            </svg>
                            GGC Logic Builder
                        </h3>
                        <div class="bg-indigo-800/50 px-4 py-1.5 rounded-lg border border-indigo-700/50">
                             <span id="codePreview" class="font-mono text-sm font-bold text-indigo-200 tracking-wider">NB-AB-OLPF-000-SE-VBLU-EN6N</span>
                        </div>
                    </div>

                    <form id="gloveCodeForm" class="p-8">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                            <div>
                                <label class="input-label">1. Primary Material</label>
                                <select id="selMaterial" class="form-input code-input font-bold" required>
                                    <option value="NB">NB - Nitrile Butadiene</option>
                                    <option value="NR">NR - Natural Rubber (Latex)</option>
                                    <option value="PI">PI - Polyisoprene</option>
                                    <option value="CR">CR - Chloroprene (Neoprene)</option>
                                </select>
                            </div>

                            <div>
                                <label class="input-label">2. Mold Geometry</label>
                                <select id="selType" class="form-input code-input font-bold" required>
                                    <option value="AB">AB - Ambidextrous</option>
                                    <option value="HS">HS - Hand Specific</option>
                                </select>
                            </div>

                            <div>
                                <label class="input-label">3. Surface Treatment</label>
                                <select id="selProcess" class="form-input code-input font-bold text-xs" required>
                                    <option value="OLPF">OLPF - Online Powder Free</option>
                                    <option value="OLPD">OLPD - Online Powdered</option>
                                    <option value="AMPF">AMPF - Antimicrobial PF</option>
                                    <option value="PCPF">PCPF - Polymer Coated PF</option>
                                    <option value="PTPF">PTPF - Post Treated PF</option>
                                    <option value="CLRP">CLRP - Cleanroom Process</option>
                                </select>
                            </div>

                            <div>
                                <label class="input-label">4. Basis Weight (g/10pcs)</label>
                                <div class="relative">
                                    <input type="text" id="selWeight" class="form-input code-input font-mono font-black" required pattern="[0-9]{3}" maxlength="3" title="3-digit weight code (e.g. 030)" placeholder="030">
                                    <span class="absolute right-4 top-3 text-[10px] font-black text-slate-300">GMS</span>
                                </div>
                            </div>

                            <div>
                                <label class="input-label">5. Physical Dimensions</label>
                                <select id="selLength" class="form-input code-input font-bold" required>
                                    <option value="SE">SE - Standard Length (SE)</option>
                                    <option value="EC">EC - Extended Cuff (EC)</option>
                                </select>
                            </div>

                            <div>
                                <label class="input-label">6. Pigmentation</label>
                                <select id="selColor" class="form-input code-input font-bold" required>
                                    <option value="VBLU">VBLU - Violet Blue</option>
                                    <option value="BLUE">BLUE - Basic Blue</option>
                                    <option value="ABLU">ABLU - Aqua Blue</option>
                                    <option value="WHTE">WHTE - Medical White</option>
                                    <option value="BLCK">BLCK - Industrial Black</option>
                                    <option value="GREY">GREY - Cool Grey</option>
                                    <option value="PINK">PINK - Soft Pink</option>
                                    <option value="GREN">GREN - Leaf Green</option>
                                </select>
                            </div>

                            <div class="sm:col-span-2">
                                <label class="input-label">7. Regulatory Compliance / Specialty</label>
                                <select id="selSpecialty" class="form-input code-input font-bold" required>
                                    <option value="EN6N">EN6N - European Std (6 Newtons)</option>
                                    <option value="ASTM">ASTM - US Medical Standard</option>
                                    <option value="ACCF">ACCF - Accelerator Free</option>
                                    <option value="ALOE">ALOE - Aloe Infused</option>
                                    <option value="OTML">OTML - Oat Meal Coated</option>
                                    <option value="FTTX">FTTX - Fingertip Textured</option>
                                    <option value="SMTH">SMTH - Smooth Finish</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-10 pt-8 border-t border-slate-100">
                            <button type="submit" class="btn-primary w-full shadow-indigo-100">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                                Registry to Master Database
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Dashboard List -->
            <div class="lg:col-span-12 xl:col-span-4 flex flex-col h-full">
                <div class="card-container flex-1 flex flex-col border-2 border-slate-100">
                    <div class="px-8 py-6 border-b border-slate-200 bg-slate-50/50">
                        <h3 class="text-xs font-black text-slate-500 uppercase tracking-[0.2em] flex items-center justify-between">
                            Active Catalog
                            <span class="bg-indigo-500 text-[9px] text-white px-2 py-0.5 rounded-full font-black">MASTER</span>
                        </h3>
                    </div>
                    <div class="p-4 flex-1 overflow-y-auto max-h-[500px]">
                        <ul id="productListUI" class="space-y-3">
                            <!-- Managed by JS -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="./app.js"></script>
</body>
</html>
